# Masar Arabia — Nginx site. Installed to /etc/nginx/sites-available/masar by setup.sh.
# certbot (deploy/README.md, step 4) adds the HTTPS server block to this file.
# Search engines may index only masararabia.com: any other address (the bare IP, a test host …)
# answers with "noindex", so it never shows up in Google as a duplicate of the real site.
map $host $masar_robots {
    default                "noindex, nofollow";
    masararabia.com        "";
    www.masararabia.com    "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name masararabia.com www.masararabia.com _;

    client_max_body_size 12m;  # blog image uploads (10 MB max)
    server_tokens off;
    add_header X-Robots-Tag $masar_robots always;

    # one address per page for search engines: www → masararabia.com
    if ($host = www.masararabia.com) {
        return 301 $scheme://masararabia.com$request_uri;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # internal only: the backend calls the website directly on 127.0.0.1 to refresh contact details
    location = /revalidate-cache {
        return 404;
    }

    # form + admin-panel API, and Django's built-in admin (fallback; the team uses /admin on the website)
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's built-in admin CSS/JS
    location /static/ {
        alias /srv/masar/app/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # images uploaded in the admin panel (blog); always re-encoded to WebP by the backend
    location /media/ {
        alias /srv/masar/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag $masar_robots always;  # (add_header here replaces the server-level ones)
        access_log off;
    }

    # everything else is the website
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
